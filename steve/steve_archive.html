<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <link rel="apple-touch-icon" sizes="180x180" href="../images/steve_summy_icon.png">
    <link rel="apple-touch-icon" sizes="152x152" href="../images/steve_summy_icon.png">
    <link rel="apple-touch-icon" sizes="120x120" href="../images/steve_summy_icon.png">
    <link rel="apple-touch-icon" href="../images/steve_summy_icon.png">
    <title>Archived Posts — Coach Steve's Sports Report</title>
    <link rel="icon" href="../images/steve_summy_icon.png">
    <style>
        /* Same page furniture as steve.html — 640px column, uppercase type,
           flat white cards on black. This one just runs longer. */

        html { scroll-behavior: smooth; }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            background: #111;
            min-height: 100vh;
            line-height: 1.4;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 16px 12px 40px;
        }

        /* ── Header ── */
        .header {
            background: #fff;
            padding: 18px 18px 14px;
            margin-bottom: 24px;
            border-radius: 4px;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }

        .header-photo {
            width: 76px;
            height: 76px;
            border-radius: 3px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #111;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 4px;
        }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 66px;
            padding: 16px 20px;
            background: #111;
            color: #fff;
            border-radius: 3px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.07em;
        }

        .back-btn:active { background: #444; }

        /* ── Team filter ── */
        .filters {
            display: flex;
            gap: 5px;
            margin-bottom: 24px;
        }

        .filter-icon {
            flex: 1;
            height: 60px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            padding: 0;
            cursor: pointer;
            background: var(--team-color, #333);
            opacity: 0.42;
            transition: opacity 0.12s;
        }

        .filter-icon.on { opacity: 1; }
        .filter-icon img { width: 34px; height: 34px; object-fit: contain; }

        .filter-icon.all {
            color: #fff;
            font-weight: 800;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: #2a2a2a;
        }

        /* ── Month divider ── */
        .month {
            background: #1e1e1e;
            color: #fff;
            padding: 8px 14px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 700;
            border-radius: 3px 3px 0 0;
            margin-top: 24px;
        }

        .month:first-of-type { margin-top: 0; }

        /* ── Story ── */
        .story {
            display: block;
            background: var(--news-bg, #fff);
            border-left: 8px solid var(--news-accent, #666);
            border-radius: 0 4px 4px 0;
            padding: 16px;
            margin-bottom: 10px;
            text-decoration: none;
            color: #111;
        }

        .story-team {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: #555;
        }

        .story-team img { width: 24px; height: 24px; object-fit: contain; }

        .story .headline {
            font-size: 1.2rem;
            font-weight: 800;
            line-height: 1.25;
            margin-top: 7px;
        }

        .story[href] .headline {
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .story .summary { font-size: 1rem; color: #333; margin-top: 5px; }

        .story .stamp {
            font-size: 0.8rem;
            color: #666;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 7px;
        }

        /* ── States ── */
        .message {
            background: #fff;
            border-radius: 4px;
            padding: 28px 18px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: #111;
        }

        .message small {
            display: block;
            font-weight: 500;
            color: #777;
            margin-top: 8px;
            font-size: 0.85rem;
        }

        .count {
            text-align: center;
            color: #666;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            padding: 20px 0 0;
        }

        a:focus-visible, button:focus-visible {
            outline: 3px solid #007acc;
            outline-offset: 2px;
        }

        @media (min-width: 520px) {
            .container { padding: 28px 24px 40px; }
            .header h1 { font-size: 2.1rem; }
            .filter-icon { height: 68px; }
            .filter-icon img { width: 40px; height: 40px; }
        }

        @media print {
            @page { size: letter portrait; margin: 0.4in; }
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            body { background: #fff !important; }
            .container { max-width: 100%; padding: 0; }
            .filters, .back-btn, .count { display: none !important; }
            .story { break-inside: avoid; margin-bottom: 6px; padding: 8px; }
            .story .headline { font-size: 10pt; }
            .story .summary { font-size: 8pt; }
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="header">
            <div class="header-top">
                <img class="header-photo" src="../images/steve_summy_badge.jpg" alt="Steve and Summy">
                <div>
                    <h1>Archived Posts</h1>
                </div>
            </div>
            <a class="back-btn" href="../steve.html">&larr; Back to Today</a>
        </div>

        <div class="filters" id="filters"></div>
        <div id="stories"><div class="message">Loading&hellip;</div></div>
        <div class="count" id="count"></div>

    </div>

<script>
(function () {
    'use strict';

    var MONTHS = ['January','February','March','April','May','June','July',
                  'August','September','October','November','December'];
    var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

    var storiesEl = document.getElementById('stories');
    var filtersEl = document.getElementById('filters');
    var countEl = document.getElementById('count');

    var state = { items: [], teams: {}, order: [], filter: 'all' };

    function parseDate(iso) {
        if (!iso) { return null; }
        var p = String(iso).split('-');
        if (p.length !== 3) { return null; }
        var d = new Date(+p[0], +p[1] - 1, +p[2]);
        return isNaN(d.getTime()) ? null : d;
    }

    function longDate(d) {
        return DAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
    }

    function monthKey(d) { return d ? MONTHS[d.getMonth()] + ' ' + d.getFullYear() : 'Undated'; }

    function el(tag, cls, text) {
        var node = document.createElement(tag);
        if (cls) { node.className = cls; }
        if (text !== undefined && text !== null) { node.textContent = text; }
        return node;
    }

    function img(src, alt) {
        var node = new Image();
        node.src = src;
        node.alt = alt || '';
        return node;
    }

    // Colors mirror steve.html so a story looks the same in both places.
    function luminance(hex) {
        var h = String(hex).replace('#', '');
        if (h.length === 3) { h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2]; }
        return 0.2126 * parseInt(h.slice(0, 2), 16) / 255 +
               0.7152 * parseInt(h.slice(2, 4), 16) / 255 +
               0.0722 * parseInt(h.slice(4, 6), 16) / 255;
    }

    function tint(hex, amount) {
        var h = String(hex).replace('#', '');
        if (h.length === 3) { h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2]; }
        var out = '#';
        for (var i = 0; i < 3; i++) {
            var c = parseInt(h.slice(i * 2, i * 2 + 2), 16);
            out += ('0' + Math.round(c + (255 - c) * amount).toString(16)).slice(-2);
        }
        return out;
    }

    function teamInfo(id) {
        return state.teams[id] || { name: 'Sports', colors: {}, logo: '' };
    }

    function accentFor(team) {
        var c = team.colors || {};
        var primary = c.primary || '#666';
        var secondary = c.secondary || primary;
        var accent = luminance(secondary) > 0.9 ? primary : secondary;
        var washBase = luminance(accent) < 0.25 ? (c.banner || primary) : accent;
        return { accent: accent, bg: tint(washBase, 0.88) };
    }

    function buildStory(item) {
        var team = teamInfo(item.teamId);
        var colors = accentFor(team);

        var card = document.createElement(item.url ? 'a' : 'div');
        card.className = 'story';
        if (item.url) {
            card.href = item.url;
        }
        card.style.setProperty('--news-accent', colors.accent);
        card.style.setProperty('--news-bg', colors.bg);

        var head = el('div', 'story-team');
        if (team.logo) { head.appendChild(img(team.logo, '')); }
        head.appendChild(el('span', null, team.name));
        card.appendChild(head);

        card.appendChild(el('div', 'headline', item.headline || ''));
        if (item.summary) { card.appendChild(el('div', 'summary', item.summary)); }

        var d = parseDate(item.date);
        var stamp = [d ? longDate(d) : null, item.source].filter(Boolean).join(' · ');
        if (stamp) { card.appendChild(el('div', 'stamp', stamp)); }
        return card;
    }

    function visibleItems() {
        if (state.filter === 'all') { return state.items; }
        return state.items.filter(function (i) { return i.teamId === state.filter; });
    }

    function renderStories() {
        var items = visibleItems();
        storiesEl.textContent = '';

        if (!items.length) {
            var box = el('div', 'message', 'No archived posts yet.');
            box.appendChild(el('small', null,
                'Stories move here once newer ones take their place on the report.'));
            storiesEl.appendChild(box);
            countEl.textContent = '';
            return;
        }

        var currentMonth = null;
        items.forEach(function (item) {
            var key = monthKey(parseDate(item.date));
            if (key !== currentMonth) {
                currentMonth = key;
                storiesEl.appendChild(el('div', 'month', key));
            }
            storiesEl.appendChild(buildStory(item));
        });

        countEl.textContent = items.length + (items.length === 1 ? ' story' : ' stories');
    }

    function buildFilter(id, team) {
        var b = el('button', 'filter-icon' + (state.filter === id ? ' on' : ''));
        b.type = 'button';
        if (id === 'all') {
            b.className += ' all';
            b.textContent = 'All';
            b.setAttribute('aria-label', 'Show every team');
        } else {
            b.style.setProperty('--team-color', (team.colors && team.colors.primary) || '#333');
            b.appendChild(img(team.logo, ''));
            b.setAttribute('aria-label', team.name);
        }
        b.addEventListener('click', function () {
            state.filter = id;
            renderFilters();
            renderStories();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        return b;
    }

    function renderFilters() {
        filtersEl.textContent = '';
        filtersEl.appendChild(buildFilter('all', null));

        // Only teams that actually have stories in here get a button.
        var seen = {};
        state.items.forEach(function (i) { if (i.teamId) { seen[i.teamId] = true; } });
        state.order.forEach(function (id) {
            if (seen[id]) { filtersEl.appendChild(buildFilter(id, teamInfo(id))); }
        });
    }

    function newestFirst(items) {
        return items.slice().sort(function (a, b) {
            return String(b.date || '').localeCompare(String(a.date || ''));
        });
    }

    function showError() {
        storiesEl.textContent = '';
        var box = el('div', 'message', 'The archived posts could not be loaded.');
        box.appendChild(el('small', null,
            'If you opened this file directly, serve the folder instead ' +
            '(for example: python -m http.server) and reload.'));
        storiesEl.appendChild(box);
    }

    function get(url) {
        return fetch(url + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) {
            if (!r.ok) { throw new Error('HTTP ' + r.status); }
            return r.json();
        });
    }

    Promise.all([
        get('steve_archive.json'),
        get('steve.json').catch(function () { return { teams: [] }; })
    ]).then(function (results) {
        var archive = results[0];
        var main = results[1];

        (main.teams || []).forEach(function (t) {
            state.teams[t.id] = t;
            state.order.push(t.id);
        });
        state.items = newestFirst(archive.items || []);

        renderFilters();
        renderStories();
    }).catch(showError);
})();
</script>
</body>
</html>
