<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <title>Sports</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            background: #111;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .go {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 420px;
            min-height: 88px;
            padding: 20px 28px;
            background: #fff;
            color: #111;
            border-radius: 4px;
            text-decoration: none;
            font-size: 1.4rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-align: center;
        }

        .go:hover, .go:focus { background: #ccc; }
        .go:focus-visible { outline: 3px solid #007acc; outline-offset: 3px; }
    </style>
</head>
<body>
    <a class="go" href="https://thegamebureau.com/ff">The Game Bureau &rarr;</a>
</body>
</html>
